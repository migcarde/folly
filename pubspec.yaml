name: folly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.3
  intl: any

  domain:
    path: packages/domain
  go_router: ^16.3.0
  phosphor_flutter: ^2.1.0
  file_picker: ^10.3.6
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  path: ^1.9.1
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env

flutter_intl:
  enabled: true